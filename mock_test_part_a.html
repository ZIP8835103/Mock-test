<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Test - Part A</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;padding:20px;color:#222}
.card{max-width:760px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 4px 18px #0001}
h1{font-size:25px;margin-top:0}
.progress{color:#666;margin-bottom:18px}
.question{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:18px}
.option{display:block;width:100%;padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:14px;background:white;text-align:left;font-size:17px;cursor:pointer}
.option:hover{background:#f0f5ff}
.option.selected{border-color:#4776e6;background:#eef3ff}
button{border:0;border-radius:12px;padding:13px 22px;font-size:17px;cursor:pointer;background:#4776e6;color:white}
button:disabled{background:#bbb}
.feedback{margin:16px 0;padding:14px;border-radius:12px;display:none}
.correct{background:#e8f7e8;color:#176b22}
.wrong{background:#ffeaea;color:#a51d1d}
.explanation{margin-top:5px;color:#333}
#next{float:right}
.result{text-align:center}
.score{font-size:42px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>📝 MOCK TEST — PART A</h1>
<div id="app"></div>
</div>

<script>
const questions = [
["What does skimming help a reader do?",["Find one specific word","Understand the general idea of a text quickly","Memorize every sentence","Read every word carefully"],1,"Skimming means reading quickly to understand the general idea."],
["A nurse wants to find a patient’s telephone number on a long contact list. Which technique should she use?",["Scanning","Detailed reading","Revision reading","Annotation"],0,"Scanning is used to find specific information quickly."],
["Which situation requires detailed reading?",["Looking at the title of a nursing article","Finding a patient’s room number","Checking instructions for giving medication","Looking through the headings of a chapter"],2,"Medication instructions require careful, detailed reading for accuracy and safety."],
["Why might a student use revision reading?",["To find one number quickly","To review information that they have already read","To avoid reading the text","To find the title of a book"],1,"Revision reading is used to review previously read information."],
["A student quickly reads the headings, first sentences, pictures, and final paragraph of an article. What technique is this?",["Scanning","Skimming","Detailed reading","Annotation"],1,"These actions help the reader get the general idea quickly, which is skimming."],
["A nursing student carefully reads each instruction in a procedure before performing it. Which technique is most appropriate?",["Skimming","Scanning","Detailed reading","Previewing"],2,"Detailed reading is appropriate when every instruction must be understood accurately."],
["What should a reader do during the before-reading stage?",["Write a final summary","Prepare for the text and think about its purpose","Answer all examination questions","Memorize the entire text"],1,"Before reading, the reader prepares and considers the purpose."],
["Which activity is an example of before-reading?",["Highlighting information while reading","Writing a summary after reading","Looking at the title and headings","Answering comprehension questions"],2,"Looking at the title and headings is a preparation activity."],
["Which activity is usually done during reading?",["Predicting the topic from the title","Highlighting important information","Choosing a textbook","Writing a final conclusion"],1,"Highlighting important information happens while reading."],
["A student underlines important information while reading an article about patient safety. Which stage is this?",["Before reading","During reading","After reading","Free writing"],1,"Underlining information while reading is a during-reading activity."],
["Which activity is part of the after-reading stage?",["Looking at the title","Predicting what the article will discuss","Writing a summary of the text","Looking at the pictures before reading"],2,"A summary is normally written after reading."],
["How can reading stages help nursing students?",["They help students understand and remember important information.","They allow students to skip difficult information.","They make detailed reading unnecessary.","They allow students to read without understanding."],0,"Using reading stages helps organize reading and improve understanding and memory."],
["Which action describes the Pointer Method?",["Moving a finger or pen along the lines while reading","Reading only the last paragraph","Writing every word in a notebook","Reading the text from the bottom to the top"],0,"The Pointer Method uses a finger or pen to guide eye movement."],
["Which material is generally suitable for practicing the Pointer Method?",["A medication dosage that must be checked exactly","A familiar English textbook passage","A legal consent document","An unfamiliar emergency instruction"],1,"Speed-reading methods are better practiced on familiar, low-risk reading material."],
["What is one purpose of tracking and pacing?",["To make reading slower","To develop a steady reading rhythm and improve speed","To memorize every medical word","To avoid reading difficult texts"],1,"Tracking and pacing help develop a consistent rhythm and reading speed."],
["Which action can help a reader maintain a steady reading pace?",["Moving a finger or pen smoothly under the words","Stopping after every word","Reading each sentence three times","Looking away from the page frequently"],0,"Smooth tracking can help maintain a steady reading pace."],
["Scanning is especially useful when a student wants to find:",["The writer’s opinion about everything","A specific name, date, number, or fact","Every supporting detail","The complete meaning of a paragraph"],1,"Scanning is used to locate specific information."],
["Why should nursing students be careful when using speed-reading techniques?",["Reading speed is always more important than understanding.","Accuracy and patient safety are more important than speed.","Nursing information should always be skipped.","Students should never read nursing materials quickly."],1,"In nursing, accuracy and patient safety must come before reading speed."],
["What does analytical reading involve?",["Reading without questioning the information","Thinking critically about ideas and evidence","Reading only the first sentence","Copying the text into a notebook"],1,"Analytical reading involves critical thinking about ideas, evidence, and arguments."],
["What does re-reading mean?",["Reading a text again for a particular purpose","Reading only the title","Searching for one patient’s name","Reading a different book"],0,"Re-reading means reading the same text again for a specific purpose."],
["What does integration mean when reading different sources?",["Connecting information and ideas from different sources","Ignoring information from other sources","Copying one source without thinking","Reading only one sentence"],0,"Integration means connecting and combining ideas from different sources."],
["Which activity is an example of annotation?",["Writing a short note beside an important idea","Reading the title only","Searching for a room number","Closing the textbook after one paragraph"],0,"Annotation means adding notes or comments to a text."],
["In an argument, what is the claim?",["The main point the writer wants the reader to accept","A spelling mistake","The page number","A picture in the text"],0,"A claim is the main position or point the writer wants the reader to accept."],
["A nursing student identifies the writer’s main claim and then finds evidence that supports it. What strategy is the student using?",["Argument mapping","Skimming","Simple present writing","Scanning"],0,"Argument mapping helps identify claims and the evidence supporting them."],
["Which sentence uses a coordinating conjunction correctly?",["The patient is tired, but she wants to walk.","The patient is tired but.","The patient because tired.","The patient is tired, she wants to walk but."],0,"'But' correctly joins two independent ideas in the sentence."]
];

let current=0, score=0, answers=[];
const app=document.getElementById("app");

function render(){
 if(current>=questions.length){showResult();return;}
 const q=questions[current];
 app.innerHTML=`
 <div class="progress">Question ${current+1} of ${questions.length}</div>
 <div class="question">${q[0]}</div>
 <div id="options"></div>
 <div id="feedback" class="feedback"></div>
 <button id="next" disabled>Next →</button>
 <div style="clear:both"></div>`;
 const options=document.getElementById("options");
 q[1].forEach((o,i)=>{
   const b=document.createElement("button");
   b.className="option";
   b.textContent=String.fromCharCode(65+i)+". "+o;
   b.onclick=()=>choose(i);
   options.appendChild(b);
 });
 document.getElementById("next").onclick=()=>{current++;render();window.scrollTo(0,0)};
}
function choose(i){
 const q=questions[current], opts=document.querySelectorAll(".option");
 opts.forEach(x=>x.disabled=true);
 opts[i].classList.add("selected");
 const f=document.getElementById("feedback");
 if(i===q[2]){
   score++; f.className="feedback correct"; f.innerHTML="✅ <b>Correct!</b><div class='explanation'>"+q[3]+"</div>";
 }else{
   f.className="feedback wrong"; f.innerHTML="❌ <b>Incorrect.</b> Correct answer: <b>"+String.fromCharCode(65+q[2])+"</b><div class='explanation'>"+q[3]+"</div>";
 }
 f.style.display="block";
 document.getElementById("next").disabled=false;
}
function showResult(){
 const pct=Math.round(score/questions.length*100);
 app.innerHTML=`<div class="result">
 <h2>🎉 Test Complete!</h2>
 <div class="score">${score}/${questions.length}</div>
 <p>${pct}%</p>
 <p>กดปุ่มด้านล่างเพื่อทำใหม่</p>
 <button onclick="current=0;score=0;render()">🔄 Restart</button>
 </div>`;
}
render();
</script>
</body>
</html>
